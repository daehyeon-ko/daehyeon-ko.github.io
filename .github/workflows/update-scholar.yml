name: Update Google Scholar metrics

on:
  workflow_dispatch:
  schedule:
    # Daily at 12:23 UTC. GitHub may delay scheduled runs.
    - cron: '23 12 * * *'
  push:
    paths:
      - 'update_scholar.py'
      - '.github/workflows/update-scholar.yml'

permissions:
  contents: write

concurrency:
  group: scholar-metrics
  cancel-in-progress: false

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            update_scholar.py
          sparse-checkout-cone-mode: false

      - name: Fetch and validate Scholar metrics
        env:
          # Optional. Leave unset to try the public Scholar profile directly.
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python3 update_scholar.py

      - name: Save verified metrics in this repository
        uses: actions/github-script@v9
        with:
          script: |
            const fs = await import('node:fs/promises');
            const text = await fs.readFile('scholar-metrics.json', 'utf8');
            const result = JSON.parse(text);
            if (result.profile_id !== 'vbTD81EAAAAJ' ||
                !Number.isSafeInteger(result.citations) || result.citations < 0 ||
                !Number.isSafeInteger(result.h_index) || result.h_index < 0 ||
                result.h_index * result.h_index > result.citations ||
                !Number.isFinite(Date.parse(result.updated_at))) {
              throw new Error('Invalid metrics; no repository file was changed.');
            }
            const path = 'scholar-metrics.json';
            const branch = context.payload.repository.default_branch;
            let sha;
            try {
              const existing = await github.rest.repos.getContent({
                ...context.repo, path, ref: branch
              });
              sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              ...context.repo,
              branch,
              path,
              sha,
              message: 'Update verified Google Scholar metrics',
              content: Buffer.from(text).toString('base64')
            });
            await core.summary
              .addHeading('Google Scholar metrics updated')
              .addTable([
                [{data: 'Citations (all time)', header: true}, String(result.citations)],
                [{data: 'h-index (all time)', header: true}, String(result.h_index)],
                [{data: 'Source timestamp', header: true}, result.updated_at]
              ])
              .write();
